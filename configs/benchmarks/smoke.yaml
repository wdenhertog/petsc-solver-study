problems:
  poisson:
    backend: cpp, python
    assembly_mode: manual
    kind: linear
    mesh_sweep:
      n: [64]
    param_sweep: {}
    labels:
      n: Mesh size (n)
    solver_sweep:
      ksp:
        - ksp_type: cg
          extra: {}
      pc:
        - pc_type: jacobi
          extra:
            pc_jacobi_type: diagonal
      direct: []

  bratu:
    backend: cpp
    kind: nonlinear
    mesh_sweep:
      n: [64]
    param_sweep:
      lambda: [3.0]
    labels:
      n: Mesh size (n)
      lambda: Bratu parameter (lambda)
    solver_sweep:
      snes:
        - snes_type: newtonls
          extra:
            snes_linesearch_type: bt
      ksp:
        - ksp_type: gmres
          extra:
            ksp_gmres_restart: 30
      pc:
        - pc_type: gamg
          extra:
            pc_gamg_type: agg

  heat:
    backend: cpp, python
    assembly_mode: manual, ufl_highlevel
    kind: transient
    mesh_sweep:
      n: [64]
    param_sweep:
      alpha: [1.0]
      ts_time_step: [0.005]
      ts_max_time: [0.05]
    labels:
      n: Mesh size (n)
      alpha: Diffusivity (alpha)
      ts_time_step: Time step
      ts_max_time: Final time
    solver_sweep:
      ts:
        - ts_type: beuler
          extra: {}
        - ts_type: cn
          extra: {}
        - ts_type: bdf
          extra:
            ts_bdf_order: 2
        - ts_type: arkimex
          extra:
            ts_arkimex_type: ars122
            ts_imex_alpha: 0.5
      ksp:
        - ksp_type: cg
          extra: {}
      pc:
        - pc_type: jacobi
          extra:
            pc_jacobi_type: diagonal
      direct: []
