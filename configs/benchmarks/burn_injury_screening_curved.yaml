# Stage 1 screening on the curved 2D (surface) burn problem.
#
# Same design as burn_injury_screening.yaml (planar). Plain ILU variants are
# left out: bjacobi+ilu diverged at the first Newton step on curved L01
# (GMRES hit the iteration cap), so only subdomain-LU, multigrid and
# MUMPS-based preconditioners are screened here.
#
# Fieldsplit entries (burn_split: chem_mech) use a DMShell decomposition that follows the
# VINEWTONRSLS active set; outer FGMRES, exact-MUMPS blocks unless noted.
#
#   pixi run benchmark --config configs/benchmarks/burn_injury_screening_curved.yaml --dry-run
# YAML anchors for the fieldsplit entries below (ignored by the runner, which only reads `problems`).
# "amg" = hypre boomeramg.
_fieldsplit_blocks:
  outer: &fs {burn_split: chem_mech, ksp_rtol: 1.0e-3, ksp_max_it: 500}
  chem_lu: &chem_lu {fieldsplit_chem_ksp_type: preonly, fieldsplit_chem_pc_type: lu, fieldsplit_chem_pc_factor_mat_solver_type: mumps}
  mech_lu: &mech_lu {fieldsplit_mech_ksp_type: preonly, fieldsplit_mech_pc_type: lu, fieldsplit_mech_pc_factor_mat_solver_type: mumps}
  mech_amg: &mech_amg {fieldsplit_mech_ksp_type: preonly, fieldsplit_mech_pc_type: hypre, fieldsplit_mech_pc_hypre_type: boomeramg}

problems:
  burn_injury:
    backend: python
    assembly_mode: ufl_highlevel
    kind: transient
    mesh_sweep:
      burn_case: [curved]
      burn_level: [1, 2, 3, 4, 6]
    param_sweep:
      burn_T_days: [30]
      burn_dt_days: [0]
      burn_dt0_days: [0.025]
      snes_lag_jacobian: [1, 2]
    labels:
      burn_case: Geometry
      burn_level: Mesh level
      burn_T_days: Final time (days)
      burn_dt_days: 0 = adaptive (production setting)
      burn_dt0_days: Initial adaptive dt (days); 0.05 fails at L4+
      snes_lag_jacobian: Jacobian lag
    solver_sweep:
      ts:
        - ts_type: bdf
          extra:
            ts_bdf_order: 2
      ksp:
        - ksp_type: gmres
          extra:
            ksp_rtol: 1.0e-3
            ksp_gmres_restart: 50
      pc:
        - pc_type: asm
          extra:
            pc_asm_overlap: 1
            sub_pc_type: lu
        - pc_type: gamg
          extra:
            pc_gamg_type: agg
        - pc_type: hypre
          extra:
            pc_hypre_type: boomeramg
      direct:
        - ksp_type: preonly
          pc_type: lu
          extra:
            pc_factor_mat_solver_type: mumps
        - ksp_type: gmres
          pc_type: lu
          extra:
            pc_factor_mat_solver_type: mumps
            mat_mumps_icntl_35: 1
            mat_mumps_cntl_7: 1.0e-6
            ksp_rtol: 1.0e-6
        # Fieldsplit chem|mech (VI reduced space), outer FGMRES, pruned after the planar
        # screening: additive was best at <=100k dofs and all fieldsplit variants lose to
        # ASM/LU above ~270k dofs. LU/LU is the control, LU/AMG tests a scalable mech block.
        - {ksp_type: fgmres, pc_type: fieldsplit, extra: {<<: [*fs, *chem_lu, *mech_lu], pc_fieldsplit_type: additive}}
        - {ksp_type: fgmres, pc_type: fieldsplit, extra: {<<: [*fs, *chem_lu, *mech_amg], pc_fieldsplit_type: additive}}
