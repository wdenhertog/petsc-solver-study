problems:
  poisson:
    backend: cpp
    assembly_mode: manual
    kind: linear
    mesh_sweep:
      n: [32, 64, 128, 256, 512, 1024]
    param_sweep: {}
    labels:
      n: Mesh size (n)
    solver_sweep:
      ksp:
        - ksp_type: cg
          extra: {}
        - ksp_type: gmres
          extra:
            ksp_gmres_restart: 20
        - ksp_type: gmres
          extra:
            ksp_gmres_restart: 50
        - ksp_type: gmres
          extra:
            ksp_gmres_restart: 100
        - ksp_type: gmres
          extra:
            ksp_gmres_restart: 150
        - ksp_type: gmres
          extra:
            ksp_gmres_restart: 200
      pc:
        - pc_type: jacobi
          extra:
            pc_jacobi_type: diagonal
        - pc_type: ilu
          extra:
            pc_factor_levels: 0
        - pc_type: ilu
          extra:
            pc_factor_levels: 1
        - pc_type: ilu
          extra:
            pc_factor_levels: 2
        - pc_type: ilu
          extra:
            pc_factor_levels: 3
        - pc_type: gamg
          extra:
            pc_gamg_type: agg
      direct:
        - ksp_type: preonly
          pc_type: lu
          extra:
            pc_factor_mat_solver_type: mumps
        - ksp_type: preonly
          pc_type: cholesky
          extra:
            pc_factor_mat_solver_type: mumps

  bratu:
    backend: cpp
    assembly_mode: manual
    kind: nonlinear
    mesh_sweep:
      n: [32, 64, 128, 256, 512, 1024]
    param_sweep:
      lambda: [1.0, 3.0, 5.0, 6.5, 6.8]
    labels:
      n: Mesh size (n)
      lambda: Bratu parameter (lambda)
    solver_sweep:
      snes:
        - snes_type: newtonls
          extra:
            snes_linesearch_type: basic
        - snes_type: newtonls
          extra:
            snes_linesearch_type: bt
        - snes_type: newtontr
          extra: {}
      ksp:
        - ksp_type: gmres
          extra:
            ksp_gmres_restart: 30
        - ksp_type: gmres
          extra:
            ksp_gmres_restart: 100
        - ksp_type: bcgs
          extra: {}
        - ksp_type: fgmres
          extra:
            ksp_gmres_restart: 50
      pc:
        - pc_type: gamg
          extra:
            pc_gamg_type: agg
        - pc_type: gamg
          extra:
            pc_gamg_type: agg
            pc_gamg_threshold: 0.05
        - pc_type: asm
          extra:
            pc_asm_overlap: 1
        - pc_type: asm
          extra:
            pc_asm_overlap: 2

  heat:
    backend: cpp, python
    assembly_mode: manual, ufl_highlevel
    kind: transient
    mesh_sweep:
      n: [32, 64, 128]
    param_sweep:
      alpha: [1.0]
      ts_time_step: [0.0025]
      ts_max_time: [0.05]
    labels:
      n: Mesh size (n)
      alpha: Diffusivity (alpha)
      ts_time_step: Time step
      ts_max_time: Final time
    solver_sweep:
      ts:
        - ts_type: beuler
          extra: {}
        - ts_type: cn
          extra: {}
        - ts_type: theta
          extra:
            ts_theta_theta: 0.75
        - ts_type: bdf
          extra:
            ts_bdf_order: 2
        - ts_type: arkimex
          extra:
            ts_arkimex_type: ars122
            ts_imex_alpha: 0.5
      ksp:
        - ksp_type: cg
          extra: {}
        - ksp_type: gmres
          extra:
            ksp_gmres_restart: 30
      pc:
        - pc_type: jacobi
          extra:
            pc_jacobi_type: diagonal
        - pc_type: gamg
          extra:
            pc_gamg_type: agg
      direct:
        - ksp_type: preonly
          pc_type: lu
          extra:
            pc_factor_mat_solver_type: mumps
